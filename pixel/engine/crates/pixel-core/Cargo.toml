[package]
name = "pixel-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
drm = ["dep:drm", "dep:libseat", "dep:evdev", "dep:input", "dep:xcursor", "dep:xkbcommon-dl", "dep:libloading", "dep:signal-hook"]

[dependencies]
rayon = "1"
rustix = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
fontdue = { workspace = true }
miniz_oxide = { workspace = true }
taffy = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
arboard = { workspace = true }
serde_json = { workspace = true }
ttf-parser = { version = "0.21", default-features = false, features = ["std", "variable-fonts"] }
unicode-width = "0.2"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
drm = { version = "0.15", optional = true }
libseat = { version = "0.2.4", default-features = false, optional = true }
evdev = { version = "0.13", optional = true }
input = { version = "0.9", default-features = false, features = ["libinput_1_19"], optional = true }
xcursor = { version = "0.3.11", optional = true }
xkbcommon-dl = { version = "0.4", optional = true }
libloading = { version = "0.8", optional = true }
signal-hook = { version = "0.3", optional = true }

[[example]]
name = "drm-ui"
required-features = ["drm"]
